[pytest]
; Only collect the real suite. test_oscar.py at the repo root is a manual
; smoke script (live API, hardcoded local transcript path) — a bare `pytest`
; must not pick it up, locally or in CI.
testpaths = tests
; The service modules (agents, usage, carousel_pdf, ...) live at the repo
; root. `python -m pytest` puts the cwd on sys.path implicitly; the bare
; `pytest` console script (CI) does not — make it explicit.
pythonpath = .
